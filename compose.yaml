# Backend on its own: api + worker + postgres + redis.
#   from the repo root: pnpm stack:backend   (reads the root .env)
#   here:               docker compose --env-file ../.env up --build
# Included by the root compose.yaml for the whole stack.

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
  image: resume-builder-backend
  environment:
    DATABASE_URL: postgres://cv:cv@postgres:5432/cv
    REDIS_URL: redis://redis:6379
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in the root .env}
    # the Swagger UI at /api/docs; off in an image unless the root .env turns it on
    API_DOCS: ${API_DOCS:-false}
    TZ: UTC
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cv
      POSTGRES_PASSWORD: cv
      POSTGRES_DB: cv
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Published on 127.0.0.1 for `pnpm dev` and `pnpm test:e2e` on the host. The project has its
    # own Postgres and Redis, so the host ports are project-specific (55432, 56379) and never meet
    # a Postgres or Redis installed on the machine; POSTGRES_PORT / REDIS_PORT in the root .env override.
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55432}:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U cv -d cv]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - 127.0.0.1:${REDIS_PORT:-56379}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # HTTP API; runs DB migrations on start
  api:
    <<: *backend
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3000/api/health]
      interval: 3s
      timeout: 3s
      retries: 40

  # generation jobs; starts after api so migrations are applied
  worker:
    <<: *backend
    command: [node, dist/worker.js]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
